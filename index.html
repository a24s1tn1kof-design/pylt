<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PYLT</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #15181a;
    font-family: 'Courier New', monospace;
    color: #0f0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* Корпус устройства */
  .device {
    position: relative;
    width: 100%;
    max-width: 400px;
    padding: 22px 18px 26px;
    background: linear-gradient(160deg, #4a5a3a 0%, #3a4630 50%, #2d3626 100%);
    border-radius: 14px;
    box-shadow:
      0 0 40px #000,
      inset 0 0 30px rgba(0,0,0,0.6),
      inset 0 2px 0 rgba(255,255,255,0.08);
    border: 2px solid #202a18;
  }

  /* Скотч-полосы (декор) */
  .device::before,
  .device::after {
    content: '';
    position: absolute;
    background: repeating-linear-gradient(
      45deg, #6b6b5a, #6b6b5a 3px, #5a5a4a 3px, #5a5a4a 6px
    );
    opacity: 0.55;
    pointer-events: none;
    z-index: 2;
  }
  .device::before {
    top: 0; bottom: 0; left: 12%; width: 22px;
  }
  .device::after {
    top: 0; bottom: 0; right: 12%; width: 22px;
  }

  /* Красная кнопка (верхний левый угол) */
  .red-btn {
    position: absolute;
    top: 22px;
    left: 18px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff4a4a, #b30000 70%, #6b0000);
    border: 3px solid #3a0000;
    box-shadow:
      0 4px 0 #4a0000,
      0 0 18px rgba(255,0,0,0.7),
      inset 0 -3px 6px rgba(0,0,0,0.5),
      inset 0 3px 6px rgba(255,255,255,0.25);
    cursor: pointer;
    z-index: 5;
    transition: transform 0.1s, box-shadow 0.15s;
  }
  .red-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #4a0000, 0 0 25px rgba(255,0,0,1), inset 0 -2px 4px rgba(0,0,0,0.6); }
  .red-btn.on {
    background: radial-gradient(circle at 35% 30%, #6bff6b, #00b300 70%, #005a00);
    border-color: #003a00;
    box-shadow: 0 4px 0 #003a00, 0 0 25px rgba(0,255,0,0.9), inset 0 -3px 6px rgba(0,0,0,0.5);
  }

  /* Зелёное табло */
  .screen {
    margin: 6px 0 20px 60px;
    height: 78px;
    background: linear-gradient(180deg, #4a7a2a, #2d5a18);
    border: 3px solid #1a2a10;
    border-radius: 6px;
    box-shadow:
      inset 0 0 20px rgba(0,0,0,0.7),
      0 0 12px rgba(80,255,80,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    position: relative;
    z-index: 1;
  }
  .screen-inner {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 3px;
    align-items: center;
  }
  .digit {
    height: 56px;
    background: rgba(0, 30, 0, 0.35);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
    color: #0a1a00;
    text-shadow: none;
    transition: 0.15s;
    font-family: 'Courier New', monospace;
  }
  .digit.filled {
    background: rgba(180, 255, 120, 0.85);
    color: #0a2a00;
    box-shadow: 0 0 15px rgba(180,255,120,0.8), inset 0 0 10px rgba(255,255,255,0.4);
    text-shadow: 0 0 6px rgba(255,255,255,0.6);
  }
  .digit.error {
    background: rgba(255, 80, 80, 0.9);
    color: #fff;
    box-shadow: 0 0 20px rgba(255,50,50,1);
    animation: shake 0.4s;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }

  /* Клавиатура */
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    background: #2a2a2a;
    padding: 14px;
    border-radius: 10px;
    border: 3px solid #1a1a1a;
    box-shadow: inset 0 0 20px #000, 0 4px 0 #0a0a0a;
    position: relative;
    z-index: 3;
    max-width: 280px;
    margin: 0 auto;
  }
  .key {
    aspect-ratio: 1 / 1;
    background: linear-gradient(180deg, #d8d8d8, #a8a8a8);
    border: 2px solid #666;
    border-radius: 6px;
    font-size: 26px;
    font-weight: bold;
    font-family: 'Courier New', monospace;
    color: #222;
    cursor: pointer;
    box-shadow: 0 3px 0 #555, inset 0 1px 0 rgba(255,255,255,0.7);
    transition: transform 0.08s, box-shadow 0.08s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .key:active {
    transform: translateY(3px);
    box-shadow: 0 0 0 #555, inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .key:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Подпись EXPLOSIVES справа */
  .label {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%) rotate(180deg);
    writing-mode: vertical-rl;
    color: #f33;
    font-size: 11px;
    letter-spacing: 3px;
    font-weight: bold;
    text-shadow: 0 0 6px #f33;
    opacity: 0.85;
    z-index: 4;
    pointer-events: none;
  }

  /* Вспышка финала */
  .flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 9998;
    transition: opacity 0.15s;
  }
  .flash.on { opacity: 1; }

  /* На низких экранах */
  @media (max-height: 700px) {
    .screen { height: 62px; }
    .digit { height: 44px; font-size: 26px; }
    .keypad { gap: 8px; padding: 10px; max-width: 240px; }
    .key { font-size: 22px; }
    .red-btn { width: 40px; height: 40px; }
  }
  @media (max-height: 600px) {
    .screen { height: 52px; margin-bottom: 12px; }
    .digit { height: 36px; font-size: 22px; }
    .keypad { max-width: 210px; gap: 6px; padding: 8px; }
    .key { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="device">
  <div class="red-btn" id="redBtn"></div>

  <div class="screen">
    <div class="screen-inner" id="screen">
      <div class="digit"></div><div class="digit"></div><div class="digit"></div><div class="digit"></div>
      <div class="digit"></div><div class="digit"></div><div class="digit"></div><div class="digit"></div>
    </div>
  </div>

  <div class="keypad" id="keypad">
    <button class="key" data-k="7">7</button>
    <button class="key" data-k="8">8</button>
    <button class="key" data-k="9">9</button>
    <button class="key" data-k="4">4</button>
    <button class="key" data-k="5">5</button>
    <button class="key" data-k="6">6</button>
    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2">2</button>
    <button class="key" data-k="3">3</button>
    <button class="key" data-k="*">*</button>
    <button class="key" data-k="0">0</button>
    <button class="key" data-k="#">#</button>
  </div>

  <div class="label">EXPLOSIVES</div>
</div>

<div class="flash" id="flash"></div>

<script>
  const SECRET_CODE = "12345678"; // ← поменяй на свой 8-значный код
  const MAX_LEN = 8;

  const redBtn  = document.getElementById('redBtn');
  const screenEl= document.getElementById('screen');
  const keys    = document.querySelectorAll('.key');
  const flash   = document.getElementById('flash');

  const digits = screenEl.querySelectorAll('.digit');

  let armed = false;      // активирована ли кнопка
  let input = "";         // текущий ввод
  let locked = false;     // блокировка после успеха

  function vibrate(p) { if (navigator.vibrate) navigator.vibrate(p); }

  function beep(freq = 800, duration = 0.08, type = 'square') {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.type = type;
      osc.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.05, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  }

  function render() {
    digits.forEach((d, i) => {
      d.classList.remove('filled', 'error');
      d.textContent = '';
      if (i < input.length) {
        d.textContent = input[i];
        d.classList.add('filled');
      }
    });
  }

  // Красная кнопка — активирует пульт
  redBtn.addEventListener('click', () => {
    if (locked) return;
    armed = !armed;
    redBtn.classList.toggle('on', armed);
    vibrate(armed ? 40 : 20);
    beep(armed ? 900 : 500, 0.1);
    if (!armed) {
      input = "";
      render();
    }
  });

  // Нажатие клавиш
  keys.forEach(k => {
    k.addEventListener('click', () => {
      if (locked) return;
      if (!armed) {
        vibrate([60, 40, 60]);
        beep(200, 0.15, 'sawtooth');
        return;
      }
      const val = k.dataset.k;
      if (input.length >= MAX_LEN) return;

      input += val;
      render();
      beep(700 + input.length * 40, 0.05);
      vibrate(15);

      if (input.length === MAX_LEN) {
        setTimeout(checkCode, 250);
      }
    });
  });

  function checkCode() {
    if (input === SECRET_CODE) {
      onSuccess();
    } else {
      onError();
    }
  }

  function onError() {
    vibrate([120, 60, 120, 60, 200]);
    beep(150, 0.4, 'sawtooth');

    digits.forEach(d => {
      d.classList.remove('filled');
      d.classList.add('error');
    });

    setTimeout(() => {
      input = "";
      render();
    }, 800);
  }

  function onSuccess() {
    locked = true;

    // Финальный звук — «бум»
    beep(80, 1.2, 'sawtooth');
    setTimeout(() => beep(60, 1.5, 'triangle'), 100);
    vibrate([200, 50, 200, 50, 500]);

    // Вспышка
    flash.classList.add('on');
    setTimeout(() => flash.classList.remove('on'), 180);

    // Все цифры ярко горят
    digits.forEach(d => d.classList.add('filled'));

    // Тряска всего устройства
    const device = document.querySelector('.device');
    let shakes = 0;
    const shakeInterval = setInterval(() => {
      const x = (Math.random() - 0.5) * 12;
      const y = (Math.random() - 0.5) * 12;
      const r = (Math.random() - 0.5) * 3;
      device.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg)`;
      shakes++;
      if (shakes > 25) {
        clearInterval(shakeInterval);
        device.style.transform = '';
      }
    }, 40);

    // Финальное состояние экрана — символы гаснут, экран "умер"
    setTimeout(() => {
      digits.forEach((d, i) => {
        setTimeout(() => {
          d.classList.remove('filled');
          d.textContent = '';
        }, i * 60);
      });
    }, 900);
  }

  render();
</script>

</body>
 </html>
