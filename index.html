<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15181a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PYLT</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'Courier New', monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Обёртка — точные пропорции картинки 388:320 */
  .stage {
    position: relative;
    width: 100vw;
    max-width: calc(100vh * 388 / 320);
    aspect-ratio: 388 / 320;
    background-image: url('i (17).jpeg');
    background-size: 100% 100%;
    background-repeat: no-repeat;
  }

  /* Красная кнопка — зона нажатия */
  .btn-zone {
    position: absolute;
    top: 14%;
    left: 8%;
    width: 14%;
    height: 17%;
    border-radius: 50%;
    cursor: pointer;
    z-index: 5;
  }

  /* Зелёная подсветка — точно такие же размеры и позиция, как у btn-zone */
  .btn-light {
    position: absolute;
    top: 14%;
    left: 8%;
    width: 14%;
    height: 17%;
    border-radius: 50%;
    pointer-events: none;
    z-index: 4;
    opacity: 0;
    transition: opacity 0.05s;
    background: radial-gradient(circle at 35% 30%,
                rgba(120,255,120,0.95),
                rgba(0,180,0,0.95) 70%,
                rgba(0,90,0,0.95));
    box-shadow: inset 0 0 15px rgba(0,255,0,0.7);
  }
  .btn-light.on { opacity: 1; }

  /* Табло — 8 ячеек */
  .display {
    position: absolute;
    top: 15%;
    left: 25%;
    width: 65%;
    height: 14%;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 1.5%;
    padding: 0.8%;
    z-index: 3;
    pointer-events: none;
    overflow: hidden;
  }
  .cell {
    border-radius: 4px;
    background: transparent;
    transition: background 0.05s, box-shadow 0.05s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2vh;
    line-height: 1;
    font-weight: bold;
    color: #0a2a00;
    font-family: 'Courier New', monospace;
    text-shadow: none;
    overflow: hidden;
  }
  .cell.filled {
    background: radial-gradient(circle, rgba(200,255,140,0.95), rgba(140,230,80,0.9));
    box-shadow: inset 0 0 8px rgba(255,255,255,0.4);
  }
  .cell.error {
    background: radial-gradient(circle, rgba(255,120,120,0.95), rgba(220,40,40,0.9));
    color: #fff;
    animation: shake 0.3s;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    33% { transform: translateX(-4px); }
    66% { transform: translateX(4px); }
  }

  /* Клавиатура — точно по картинке, по центру */
  .keypad {
    position: absolute;
    top: 47%;
    left: 33%;
    width: 34%;
    height: 42%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 2.5%;
    padding: 2.5%;
    z-index: 4;
  }
  .key {
    background: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0;
    color: transparent;
    transition: background 0.05s;
  }
  .key:active {
    background: rgba(255,255,255,0.25);
  }
  .key:disabled { cursor: not-allowed; background: transparent; }

  /* Вспышка финала */
  .flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 9998;
    transition: opacity 0.1s;
  }
  .flash.on { opacity: 1; }

  /* Тряска */
  .stage.shake {
    animation: stageShake 0.4s infinite;
  }
  @keyframes stageShake {
    0% { transform: translate(0,0) rotate(0); }
    20% { transform: translate(-6px,3px) rotate(-1deg); }
    40% { transform: translate(5px,-4px) rotate(1deg); }
    60% { transform: translate(-4px,-3px) rotate(-0.5deg); }
    80% { transform: translate(6px,4px) rotate(0.8deg); }
    100% { transform: translate(0,0) rotate(0); }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="btn-light" id="btnLight"></div>
  <div class="btn-zone" id="btnZone"></div>

  <div class="display" id="display">
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
  </div>

  <div class="keypad" id="keypad">
    <button class="key" data-k="7"></button>
    <button class="key" data-k="8"></button>
    <button class="key" data-k="9"></button>
    <button class="key" data-k="4"></button>
    <button class="key" data-k="5"></button>
    <button class="key" data-k="6"></button>
    <button class="key" data-k="1"></button>
    <button class="key" data-k="2"></button>
    <button class="key" data-k="3"></button>
    <button class="key" data-k="*"></button>
    <button class="key" data-k="0"></button>
    <button class="key" data-k="#"></button>
  </div>
</div>

<div class="flash" id="flash"></div>

<script>
  const SECRET_CODE = "12345678";
  const MAX_LEN = 8;

  const stage    = document.getElementById('stage');
  const btnZone  = document.getElementById('btnZone');
  const btnLight = document.getElementById('btnLight');
  const display  = document.getElementById('display');
  const keys     = document.querySelectorAll('.key');
  const flash    = document.getElementById('flash');
  const cells    = display.querySelectorAll('.cell');

  let armed  = false;
  let input  = "";
  let locked = false;

  function vibrate(p) { if (navigator.vibrate) navigator.vibrate(p); }

  function beep(freq = 800, dur = 0.06, type = 'square') {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.type = type;
      osc.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.05, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.start();
      osc.stop(ctx.currentTime + dur);
    } catch(e) {}
  }

  function render() {
    cells.forEach((c, i) => {
      c.classList.remove('filled', 'error');
      c.textContent = '';
      if (i < input.length) {
        c.textContent = input[i];
        c.classList.add('filled');
      }
    });
  }

  btnZone.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (locked) return;
    armed = !armed;
    btnLight.classList.toggle('on', armed);
    vibrate(armed ? 40 : 20);
    beep(armed ? 1000 : 500, 0.05);
    if (!armed) { input = ""; render(); }
  });

  keys.forEach(k => {
    k.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (locked) return;
      if (!armed) {
        vibrate([50, 30, 50]);
        beep(200, 0.1, 'sawtooth');
        return;
      }
      const val = k.dataset.k;
      if (input.length >= MAX_LEN) return;
      input += val;
      render();
      beep(700 + input.length * 40, 0.04);
      vibrate(12);
      if (input.length === MAX_LEN) setTimeout(checkCode, 200);
    });
  });

  function checkCode() {
    if (input === SECRET_CODE) onSuccess();
    else onError();
  }

  function onError() {
    vibrate([100, 50, 100, 50, 150]);
    beep(150, 0.3, 'sawtooth');
    cells.forEach(c => { c.classList.remove('filled'); c.classList.add('error'); });
    setTimeout(() => { input = ""; render(); }, 700);
  }

  function onSuccess() {
    locked = true;
    beep(80, 1.0, 'sawtooth');
    setTimeout(() => beep(60, 1.2, 'triangle'), 80);
    vibrate([200, 40, 200, 40, 400]);
    flash.classList.add('on');
    setTimeout(() => flash.classList.remove('on'), 150);
    cells.forEach(c => c.classList.add('filled'));
    stage.classList.add('shake');
    setTimeout(() => stage.classList.remove('shake'), 1000);
    setTimeout(() => {
      cells.forEach((c, i) => {
        setTimeout(() => {
          c.classList.remove('filled');
          c.textContent = '';
        }, i * 50);
      });
    }, 900);
  }

  render();
</script>

</body>
 </html>
